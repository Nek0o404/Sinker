<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 260px;
      font-family: system-ui, sans-serif;
      background: #1a1a1a;
      color: #f0f0f0;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .logo { font-size: 20px; }
    .title { font-size: 15px; font-weight: 600; }
    .subtitle { font-size: 11px; color: #888; }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #2a2a2a;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .toggle-label { font-size: 13px; }
    .toggle-desc { font-size: 11px; color: #888; margin-top: 2px; }

    /* Toggle switch */
    .switch { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #444; border-radius: 22px;
      cursor: pointer; transition: background 0.2s;
    }
    .slider:before {
      content: "";
      position: absolute;
      width: 16px; height: 16px;
      left: 3px; top: 3px;
      background: white; border-radius: 50%;
      transition: transform 0.2s;
    }
    input:checked + .slider { background: #e24b4a; }
    input:checked + .slider:before { transform: translateX(18px); }

    .status-badge {
      text-align: center;
      font-size: 11px;
      padding: 6px;
      border-radius: 6px;
      margin-bottom: 12px;
      transition: all 0.2s;
    }
    .status-badge.on  { background: #2d1f1f; color: #e24b4a; }
    .status-badge.off { background: #1f2d1f; color: #639922; }

    .divider { border: none; border-top: 1px solid #2a2a2a; margin: 12px 0; }

    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #888;
      margin-bottom: 6px;
    }
    .info-row span:last-child { color: #f0f0f0; }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">🪝</span>
    <div>
      <div class="title">Castline</div>
      <div class="subtitle">釣魚表單偵測</div>
    </div>
  </div>

  <div id="statusBadge" class="status-badge on">攔截已啟用</div>

  <div class="toggle-row">
    <div>
      <div class="toggle-label">攔截可疑登入</div>
      <div class="toggle-desc">偵測非白名單的密碼提交</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggleInterception" checked>
      <span class="slider"></span>
    </label>
  </div>

  <hr class="divider">

  <div class="info-row">
    <span>目前網域</span>
    <span id="currentDomain">—</span>
  </div>
  <div class="info-row">
    <span>白名單狀態</span>
    <span id="trustStatus">—</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
